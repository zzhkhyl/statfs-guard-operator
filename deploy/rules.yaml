# source: config/rules/prometheus-rules.yaml
# Alerting rules in native Prometheus / vmalert format: a bare `groups:` list,
# with no apiVersion, kind or metadata. This file is NOT a Kubernetes object and
# must never be `kubectl apply`-ed.
#
# Load it into whatever evaluates rules:
#   - Prometheus: place it under a path listed in `rule_files`, then reload;
#   - vmalert:    point -rule at it (or its directory).
#
# `make bundle` copies this directory verbatim into deploy/rules.yaml, which is
# the artifact to hand to the monitoring stack.
#
# Why not a CRD: the clusters this runs on may have neither the Prometheus
# Operator (monitoring.coreos.com) nor the VictoriaMetrics Operator
# (operator.victoriametrics.com). Both would make `kubectl apply` fail, and the
# rules would never load. Everything below only needs PromQL.
#
# Design premise: kubelet_volume_stats_used_bytes on a CephFS volume can
# under-report by up to 100% and stay wrong for months. These rules read
# cephfs_guard_volume_* instead, which comes from ceph.dir.rbytes via the agent.
groups:
  - name: cephfs-statfs-guard
    rules:
      - alert: CephFSVolumeAlmostFull
        # Real fullness, from ceph.dir.rbytes / ceph.quota.max_bytes.
        expr: |
          cephfs_guard_volume_used_ratio > 0.85
          and on (pv, pvc_namespace, pvc)
          cephfs_guard_volume_probe_success == 1
        for: 15m
        labels:
          severity: critical
          component: cephfs
        annotations:
          summary: >-
            CephFS PVC {{ $labels.pvc_namespace }}/{{ $labels.pvc }} is
            {{ $value | humanizePercentage }} full
          description: >-
            MDS says {{ $labels.pvc }} holds the reported fraction of its
            cephfs_guard_volume_quota_bytes quota, on node
            {{ $labels.node }} (pv {{ $labels.pv }}). This figure comes from
            ceph.dir.rbytes, not from kubelet, because the kubelet figure is
            not trustworthy on CephFS.

      # There is deliberately no "drift != 0" rule. With auto-heal on, drift is
      # measured on every probe and is non-zero on almost every volume
      # (KB-to-MB, far inside the max(64MiB, 5%) tolerance). Such a rule either
      # pages constantly or never satisfies `for`, depending on timing. "This
      # volume was under-reported at some point" is a dashboard fact, expressed
      # by cephfs_guard_volume_drift_episodes > 0, not an alert.

      - alert: CephFSStatfsDriftPersists
        # A heal was issued and the next pass still disagrees: the read-only
        # revalidation did not converge, so escalate.
        expr: |
          cephfs_guard_volume_phase{phase="Healing"} == 1
        for: 15m
        labels:
          severity: warning
          component: cephfs
        annotations:
          summary: >-
            CephFS {{ $labels.pvc_namespace }}/{{ $labels.pvc }} stays in an
            open drift episode after revalidation
          description: >-
            Node {{ $labels.node }} has not converged after the agent read
            ceph.dir.rbytes. Check the agent pod on that node and the MDS
            health before trusting any usage figure for this volume.

      - alert: CephFSStatfsGuardTruthUnavailable
        # `Skipped` means "this volume is not mounted / out of scope, so there is
        # no kubelet figure to compare against" -- not a failure. Without the
        # unless clause every unmounted volume would page after 15 minutes.
        expr: |
          cephfs_guard_volume_probe_success == 0
          unless on (pv)
          cephfs_guard_volume_phase{phase="Skipped"} == 1
        for: 15m
        labels:
          severity: warning
          component: cephfs
        annotations:
          summary: >-
            No ground truth for CephFS volume
            {{ $labels.pvc_namespace }}/{{ $labels.pvc }}
          description: >-
            Neither the agent on {{ $labels.node }} nor the operator could
            read the MDS rstat, so nothing is verifying this volume's usage.

      - alert: CephFSStatfsGuardAgentDown
        # Judged on the operator's own view of the agents rather than on the
        # scrape job name: job names are assigned by the scrape configuration
        # and would tie this rule to one particular setup.
        expr: |
          cephfs_guard_agent_up == 0
        for: 10m
        labels:
          severity: warning
          component: cephfs
        annotations:
          summary: statfs-guard agent is down on {{ $labels.node }}
          description: >-
            Without the agent nothing revalidates this node's CephFS client
            cache, so the kubelet usage figures for volumes on this node drift
            back into being wrong.
